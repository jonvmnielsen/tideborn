<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5fb2ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tideborn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="game" aria-label="Tideborn spilverden"></canvas>

  <div id="loading" class="loading">
    <div class="loading-card">
      <div class="logo">Tideborn</div>
      <div class="bar"><div class="bar-fill" id="loadFill"></div></div>
      <div class="loading-text" id="loadText">Henter øen …</div>
    </div>
  </div>

  <div id="hud" class="hud" hidden>
    <div class="zone zone-move" id="moveZone"></div>
    <div class="zone zone-look" id="lookZone"></div>
    <div class="stick" id="stick" hidden><div class="knob" id="knob"></div></div>

    <div class="status">
      <div class="meter" title="Liv"><span class="meter-label">Liv</span><div class="meter-track"><div class="meter-fill hp" id="hpFill"></div></div></div>
      <div class="meter" title="Sult"><span class="meter-label">Mæt</span><div class="meter-track"><div class="meter-fill food" id="foodFill"></div></div></div>
      <button class="eat" id="eatBtn" type="button" hidden><img src="./ui/food.webp" alt=""><span>Spis</span></button>
    </div>

    <div class="topright">
      <div class="clock" id="clock">Dag 1 · 07:00</div>
      <div class="tr-buttons">
        <button class="round-btn" id="invBtn" type="button" aria-label="Rygsæk og crafting"><img src="./ui/wood.webp" alt=""><span>Rygsæk</span></button>
        <button class="round-btn" id="buildBtn" type="button" aria-label="Byg"><img src="./ui/b_wall.webp" alt=""><span>Byg</span></button>
      </div>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="objective" id="objective"></div>

    <div class="actions">
      <div class="build-tools" id="buildTools" hidden>
        <div class="action-row">
          <button class="small-btn" id="upBtn" type="button" aria-label="Hæv">▲ Op</button>
          <span class="level" id="levelLabel">Etage 1</span>
          <button class="small-btn" id="downBtn" type="button" aria-label="Sænk">▼ Ned</button>
        </div>
        <div class="action-row">
          <button class="small-btn" id="rotateBtn" type="button">⟳ Drej</button>
          <button class="small-btn" id="removeBtn" type="button">Fjern</button>
        </div>
      </div>
      <button class="action" id="action" type="button" disabled aria-label="Handling">
        <img id="actionIcon" src="./ui/tree.webp" alt="">
        <span id="actionLabel">—</span>
      </button>
    </div>

    <div class="palette" id="palette" hidden></div>
    <div id="floaters"></div>
  </div>

  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <header class="sheet-head">
      <h2 id="sheetTitle">Rygsæk</h2>
      <button class="close" id="sheetClose" type="button" aria-label="Luk">×</button>
    </header>
    <div class="sheet-body">
      <div class="col">
        <h3>Du har</h3>
        <div class="items" id="invItems"></div>
      </div>
      <div class="col" id="craftCol">
        <h3>Lav</h3>
        <div class="recipes" id="recipes"></div>
      </div>
      <div class="col" id="chestCol" hidden>
        <h3>I kisten</h3>
        <div class="items" id="chestItems"></div>
      </div>
    </div>
  </section>

  <div class="overlay" id="overlay" hidden><div class="overlay-text" id="overlayText"></div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
